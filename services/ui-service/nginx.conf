server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}

