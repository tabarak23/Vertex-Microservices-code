name: product-service-ci

on:
  push:
    branches: [ "production" ]
    paths:
      - "services/product-service/**"
      - ".github/workflows/product-service.yml"
  pull_request:
    branches: [ "production" ]
    paths:
      - "services/product-service/**"

concurrency:
  group: product-service-main
  cancel-in-progress: true

env:
  SERVICE_PATH: services/product-service
  NODE_VERSION: "20"
  AWS_REGION: us-west-1
  ECR_REPOSITORY: vertex_ecr
  SONAR_PROJECT_KEY: tabarak23_Vertex-Microservices-code
  SONAR_ORGANIZATION: tabarak23

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:

  ci:
    name: Lint • Test • Security • Sonar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.SERVICE_PATH }}/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: NPM Audit
        run: npm audit --audit-level=high


      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Run Tests
        run: npm test --if-present

      - name: Semgrep Scan
        uses: returntocorp/semgrep-action@v1

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: services/product-service
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.sources=.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} 


  docker:
    name: build,scan,sbom,push ecr
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image URI
        id: image
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          IMAGE_URI=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image (no push)
        uses: docker/build-push-action@v5
        with:
          context: services/product-service
          load: true
          tags: product-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

      - name: Trivy Scan (Fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: product-service:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          trivyignores: .trivyignore


      - name: Generate SARIF
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: product-service:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Tag for ECR
        run: |
          docker tag product-service:${{ github.sha }} \
          ${{ steps.image.outputs.image_uri }}

      - name: Push to ECR
        run: |
          docker push ${{ steps.image.outputs.image_uri }}

      - name: Tag Latest
        run: |
          docker tag product-service:${{ github.sha }} \
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
