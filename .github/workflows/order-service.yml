name: order-service-ci

on:
  push:
    branches: [ "production" ]
    paths:
      - "services/order-service/**"
      - ".github/workflows/order-service.yml"
  pull_request:
    branches: [ "production" ]
    paths:
      - "services/order-service/**"

concurrency:
  group: order-service-main
  cancel-in-progress: true

env:
  SERVICE_PATH: services/order-service
  JAVA_VERSION: "17"
  AWS_REGION: us-west-1
  ECR_REPOSITORY: order-service
  SONAR_PROJECT_KEY: tabarak23_Vertex-Microservices-code
  SONAR_ORGANIZATION: tabarak23
permissions:
  contents: read
  id-token: write
  security-events: write


jobs:

  ci:
    name: Build • Test • Security • Sonar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build & Test
        run: mvn -B clean verify

      - name: OWASP Dependency Check
        run: mvn org.owasp:dependency-check-maven:check \
            -DautoUpdate=true \
            -DfailOnError=false

      - name: Semgrep Scan
        uses: returntocorp/semgrep-action@v1

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: services/order-service
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.sources=src/main/java
            -Dsonar.java.binaries=target/classes


  docker:
    name: Build • Scan • SBOM • Push ECR
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image URI
        id: image
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          IMAGE_URI=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image (no push)
        uses: docker/build-push-action@v5
        with:
          context: services/order-service
          load: true
          tags: order-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

      - name: Trivy Scan (Fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: order-service:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Generate SARIF
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: order-service:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Tag for ECR
        run: |
          docker tag order-service:${{ github.sha }} \
          ${{ steps.image.outputs.image_uri }}

      - name: Push to ECR
        run: |
          docker push ${{ steps.image.outputs.image_uri }}

      - name: Tag Latest
        run: |
          docker tag order-service:${{ github.sha }} \
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
